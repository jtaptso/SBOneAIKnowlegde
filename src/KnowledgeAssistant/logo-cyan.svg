<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Cyan gradient for central node -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0FF"/>
      <stop offset="100%" stop-color="#0FA3FF"/>
    </linearGradient>
  </defs>

  <!-- Outer network ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#00E0FF" stroke-width="0.6" opacity="0.25" stroke-dasharray="7,9"/>

  <!-- Connection lines -->
  <g fill="none" stroke="#00E0FF" stroke-width="2.5" opacity="0.55" stroke-linecap="round">
    <path d="M 100,69.7 C 93,55 107,47 100,32"/>
    <path d="M 117.5,130.3 C 132,137 142,139 153,140"/>
    <path d="M 82.5,130.3 C 68,137 58,139 47,140"/>
  </g>

  <!-- Data-flow particles -->
  <g fill="#00E0FF">
    <circle cx="97" cy="57" r="2.8" filter="url(#glow)"/>
    <circle cx="103" cy="44" r="2" opacity="0.7"/>
    <circle cx="126" cy="133.5" r="2.8" filter="url(#glow)"/>
    <circle cx="140" cy="137" r="2" opacity="0.7"/>
    <circle cx="74" cy="133.5" r="2.8" filter="url(#glow)"/>
    <circle cx="60" cy="137" r="2" opacity="0.7"/>
  </g>

  <!-- Peripheral nodes -->
  <g filter="url(#glow)">
    <circle cx="100" cy="32" r="11" fill="#00E0FF"/>
    <circle cx="153" cy="140" r="11" fill="#00E0FF"/>
    <circle cx="47" cy="140" r="11" fill="#00E0FF"/>
  </g>
  <!-- Inner highlight on peripheral nodes -->
  <g fill="#F5F7FA" opacity="0.3">
    <circle cx="100" cy="32" r="4.5"/>
    <circle cx="153" cy="140" r="4.5"/>
    <circle cx="47" cy="140" r="4.5"/>
  </g>

  <!-- Central hexagon hub -->
  <polygon points="135,100 117.5,130.31 82.5,130.31 65,100 82.5,69.69 117.5,69.69"
           fill="url(#cyanGrad)"
           filter="url(#glow-strong)"
           stroke="#00E0FF"
           stroke-width="1.5"/>

  <!-- Inner hexagon accent -->
  <polygon points="128,100 114,124.25 86,124.25 72,100 86,75.75 114,75.75"
           fill="none"
           stroke="#F5F7FA"
           stroke-width="0.7"
           opacity="0.2"/>

  <!-- SB1 monogram -->
  <text x="100" y="108"
        text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-weight="700"
        font-size="21"
        fill="#0B1F3B"
        letter-spacing="1.5">SB1</text>
</svg>
