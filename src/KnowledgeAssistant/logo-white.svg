<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer network ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#F5F7FA" stroke-width="0.6" opacity="0.22" stroke-dasharray="7,9"/>

  <!-- Connection lines -->
  <g fill="none" stroke="#F5F7FA" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
    <path d="M 100,69.7 C 93,55 107,47 100,32"/>
    <path d="M 117.5,130.3 C 132,137 142,139 153,140"/>
    <path d="M 82.5,130.3 C 68,137 58,139 47,140"/>
  </g>

  <!-- Data-flow particles -->
  <g fill="#F5F7FA">
    <circle cx="97" cy="57" r="2.5" filter="url(#glow)"/>
    <circle cx="103" cy="44" r="1.8" opacity="0.55"/>
    <circle cx="126" cy="133.5" r="2.5" filter="url(#glow)"/>
    <circle cx="140" cy="137" r="1.8" opacity="0.55"/>
    <circle cx="74" cy="133.5" r="2.5" filter="url(#glow)"/>
    <circle cx="60" cy="137" r="1.8" opacity="0.55"/>
  </g>

  <!-- Peripheral nodes -->
  <g filter="url(#glow)">
    <circle cx="100" cy="32" r="11" fill="#F5F7FA" opacity="0.8"/>
    <circle cx="153" cy="140" r="11" fill="#F5F7FA" opacity="0.8"/>
    <circle cx="47" cy="140" r="11" fill="#F5F7FA" opacity="0.8"/>
  </g>

  <!-- Central hexagon (outlined for mono version so text is legible) -->
  <polygon points="135,100 117.5,130.31 82.5,130.31 65,100 82.5,69.69 117.5,69.69"
           fill="none"
           filter="url(#glow-strong)"
           stroke="#F5F7FA"
           stroke-width="2.2"/>

  <!-- Inner hexagon accent -->
  <polygon points="128,100 114,124.25 86,124.25 72,100 86,75.75 114,75.75"
           fill="none"
           stroke="#F5F7FA"
           stroke-width="0.7"
           opacity="0.2"/>

  <!-- SB1 monogram -->
  <text x="100" y="108"
        text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-weight="700"
        font-size="21"
        fill="#F5F7FA"
        letter-spacing="1.5">SB1</text>
</svg>
